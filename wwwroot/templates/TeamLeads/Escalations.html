<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalation - RM CMS</title>
    <link rel="icon" href="../assets/Images/favicon.ico">
    <link href="../assets/css/teamlead-shell.css" rel="stylesheet">
    <link href="../assets/css/toast.css" rel="stylesheet">
    <script>window.TL_PAGE = 'escalation';</script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/api-config.js"></script>
    <!-- auth.js: attaches the bearer token to every API call -->
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/teamlead-shell.js"></script>
    <script src="../assets/js/escalations.js"></script>

    <style>
        /* Tier badges: the one place this screen needs colour the shell does not
           already provide. EMERGENCY has to be unmissable. */
        .tier-EMERGENCY { background: #fee2e2; color: #991b1b; }
        .tier-URGENT { background: #fef9c3; color: #854d0e; }
        .tier-STANDARD { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

        .waiting-long { color: #b91c1c; font-weight: 700; }

        .desc-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div id="tlShell"></div>

    <div class="tl-body is-narrow">

        <a class="tl-back" href="TeamLeadDashboard.html">&#8592; Back to dashboard</a>

        <h1 class="tl-page-title">Escalation</h1>
        <p class="tl-page-sub" id="escSummary">A concern raised out of the normal follow-up path.</p>

        <!-- ── What was raised ── -->
        <div class="tl-card">
            <div class="tl-card-head">
                <div class="tl-card-icon">&#9888;&#65039;</div>
                <h2 class="tl-card-title">What was raised</h2>
                <span class="tl-card-note" id="escId">—</span>
            </div>
            <div class="tl-card-body">

                <div class="tl-row">
                    <span class="tl-row-label">Person</span>
                    <span class="tl-row-value" id="personId">—</span>
                </div>
                <div class="tl-row">
                    <span class="tl-row-label">Reason</span>
                    <span class="tl-row-value" id="reason">—</span>
                </div>
                <div class="tl-row">
                    <span class="tl-row-label">Tier</span>
                    <span class="tl-row-value"><span id="tier">—</span></span>
                </div>
                <div class="tl-row">
                    <span class="tl-row-label">Status</span>
                    <span class="tl-row-value" id="status">—</span>
                </div>
                <div class="tl-row">
                    <span class="tl-row-label">Raised by</span>
                    <span class="tl-row-value" id="raisedBy">—</span>
                </div>
                <div class="tl-row">
                    <span class="tl-row-label">Waiting</span>
                    <span class="tl-row-value" id="waiting">—</span>
                </div>

                <div class="tl-field" style="margin-top:16px;margin-bottom:0;">
                    <label class="tl-label">What the volunteer wrote</label>
                    <div class="desc-box" id="desc">—</div>
                </div>

                <div class="tl-actions" style="margin-top:18px;">
                    <button class="tl-save" id="ackBtn">Acknowledge</button>
                </div>
                <div class="tl-hint" id="ackHint">Acknowledging tells the system somebody has this. The case stays paused until it is resolved.</div>

            </div>
        </div>

        <!-- ── Close it out ── -->
        <div class="tl-card" id="resolveDiv">
            <div class="tl-card-head">
                <div class="tl-card-icon">&#128274;</div>
                <h2 class="tl-card-title">Close it out</h2>
            </div>
            <div class="tl-card-body">

                <div class="tl-field">
                    <label class="tl-label" for="statusSelect">Outcome status *</label>
                    <select id="statusSelect" class="tl-select">
                        <option value="">— Select —</option>
                        <option value="RESOLVED">Resolved</option>
                        <option value="REFERRED_OUT">Referred out</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                </div>

                <div class="tl-field">
                    <label class="tl-label" for="outcomeSelect">What happened *</label>
                    <!-- Values are the escalation_outcome codes the API expects;
                         the labels are unchanged from what team leads already read. -->
                    <select id="outcomeSelect" class="tl-select">
                        <option value="">— Select —</option>
                        <option value="PASTORAL_CARE">Pastoral care scheduled</option>
                        <option value="COUNSELLING_REFERRAL">Counselling referral</option>
                        <option value="BENEVOLENCE">Benevolence provided</option>
                        <option value="RESOURCE_CONNECTED">Connected to a resource</option>
                        <option value="EMERGENCY_SERVICES">Emergency services called</option>
                        <option value="NO_ACTION_NEEDED">No action needed</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="tl-field">
                    <label class="tl-label" for="resource">Resource connected to</label>
                    <input type="text" id="resource" class="tl-input" placeholder="Name of the person or service, if any" />
                </div>

                <div class="tl-field">
                    <label class="tl-label" for="notes">Resolution notes</label>
                    <textarea id="notes" class="tl-textarea" placeholder="What was done, and anything the next person needs to know"></textarea>
                </div>

                <!-- Safeguarding. Shown only for reasons the schema flags
                     requires_protocol (abuse disclosure, self-harm risk) — the API
                     refuses to resolve those without an answer, and asking every
                     ordinary concern would train people to tick without reading. -->
                <div id="safeguardingGroup" style="display:none;">
                    <div class="tl-section">Safeguarding</div>

                    <label class="tl-check" for="protocolFollowed">
                        <input type="checkbox" id="protocolFollowed" />
                        <span>The safeguarding protocol was followed</span>
                    </label>

                    <label class="tl-check" for="authoritiesContacted">
                        <input type="checkbox" id="authoritiesContacted" />
                        <span>Authorities were contacted</span>
                    </label>

                    <label class="tl-check" for="volunteerDebriefed">
                        <input type="checkbox" id="volunteerDebriefed" />
                        <span>The volunteer was debriefed</span>
                    </label>
                </div>

                <div class="tl-actions" style="margin-top:16px;">
                    <button class="tl-save" id="resolveBtn">Resolve</button>
                    <a class="tl-secondary" href="TeamLeadDashboard.html" style="text-decoration:none;">Cancel</a>
                </div>

                <p class="tl-message" id="message"></p>

            </div>
        </div>

    </div>

</body>
</html>
