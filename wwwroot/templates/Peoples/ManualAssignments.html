<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assign cases - RM CMS</title>
    <link rel="icon" href="../assets/Images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/teamlead-shell.css" rel="stylesheet">
    <link href="../assets/css/toast.css" rel="stylesheet">
    <script>window.TL_PAGE = 'assign';</script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/api-config.js"></script>
    <!-- auth.js: attaches the bearer token to every API call -->
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/teamlead-shell.js"></script>
    <script src="../assets/js/manualAssignments.js"></script>

    <style>
        /* Only what the shell does not already provide. Bootstrap is loaded for
           the modal, so its form controls are pulled back to the shell's look. */
        .btn-assign {
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--t);
        }

            .btn-assign:hover { background: var(--primary-hover); }

        .cell-ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
        .cell-name { font-weight: 600; }
        .cell-muted { color: var(--muted); }

        .modal-content { border: 1px solid var(--border); border-radius: 16px; font-family: var(--font); }
        .modal-header { border-bottom: 1px solid var(--border); padding: 14px 20px; }
        .modal-title { font-size: 15px; font-weight: 700; }
        .modal-body { padding: 18px 20px; }
        .modal-footer { border-top: 1px solid var(--border); padding: 12px 20px; }

        /* Capacity read-out. Amber when the pick would push somebody over their
           band — manual assignment is allowed to do that, but never quietly. */
        #capacityInfo {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
            font-size: 13px;
            color: var(--muted);
        }

            #capacityInfo.over-capacity {
                background: #fef3c7;
                border-color: var(--warning);
                color: #92400e;
                font-weight: 600;
            }
    </style>
</head>
<body>

    <div id="tlShell"></div>

    <div class="tl-body">

        <a class="tl-back" href="../TeamLeads/TeamLeadDashboard.html">&#8592; Back to dashboard</a>

        <h1 class="tl-page-title">Assign cases</h1>
        <p class="tl-page-sub">Cases with no volunteer. Assigning by hand is for when the automatic picker found nobody.</p>

        <div class="tl-card">
            <div class="tl-card-head">
                <div class="tl-card-icon">&#128203;</div>
                <h2 class="tl-card-title">Awaiting assignment</h2>
                <span class="tl-card-note" id="queueCount"></span>
            </div>
            <div class="tl-card-body is-flush">
                <div class="tl-scroll">
                    <table class="tl-table" id="manualTable">
                        <thead>
                            <tr>
                                <th>Case</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Assign Modal -->
    <div class="modal fade" id="assignModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Assign a volunteer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="assignPersonId" />

                    <div class="tl-field">
                        <label class="tl-label" for="volunteerSelect">Volunteer</label>
                        <select id="volunteerSelect" class="tl-select"></select>
                    </div>

                    <div class="tl-field" style="margin-bottom:0;">
                        <label class="tl-label">Current load</label>
                        <div id="capacityInfo">&#8212;</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="tl-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmAssign" class="tl-save">Assign</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
