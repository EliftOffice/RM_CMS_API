<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - RM CMS</title>

    <link rel="icon" href="../../templates/assets/Images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../../templates/assets/js/api-config.js"></script>
    <script src="../../templates/assets/js/toast.js"></script>
    <script src="../../templates/assets/js/auth.js"></script>
    <script src="../../templates/assets/js/password-policy.js"></script>

    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .cp-card {
            background: #fff;
            width: 100%;
            max-width: 430px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            padding: 32px 28px;
        }

        .cp-title { font-size: 21px; font-weight: 600; margin-bottom: 6px; color: #1f2937; }
        .cp-sub { font-size: 14px; color: #6b7280; margin-bottom: 20px; }
        .cp-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin: 14px 0 6px; }

        .cp-input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .cp-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

        .cp-btn {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .cp-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        .cp-rules { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
        .cp-rules ul { margin: 0; padding-left: 18px; }
        .cp-rules li { font-size: 12.5px; color: #6b7280; line-height: 1.7; }
        .cp-rules li.ok { color: #059669; }
    </style>
</head>
<body>

    <div class="cp-card">

        <div class="cp-title">Set a new password</div>
        <div class="cp-sub">Your account requires a new password before you can continue.</div>

        <form id="changePasswordForm" autocomplete="off">

            <label class="cp-label" for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" class="cp-input" autocomplete="current-password" required maxlength="128">

            <label class="cp-label" for="newPassword">New password</label>
            <input type="password" id="newPassword" class="cp-input" autocomplete="new-password" required maxlength="128">

            <label class="cp-label" for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" class="cp-input" autocomplete="new-password" required maxlength="128">

            <!-- Rules come from /api/auth/password-policy, so this list cannot drift
                 from what the server enforces. The previous hardcoded list omitted the
                 two rules people actually trip over: "must not contain your name" and
                 "must not reuse a recent password". -->
            <div class="cp-rules">
                <ul id="passwordRulesList"></ul>
            </div>

            <button type="submit" id="submitBtn" class="cp-btn">Update password</button>

        </form>
    </div>

    <script>
        // This page is reached while signed in but flagged MustChangePassword, so let
        // auth.js establish the session without its usual redirect-to-ChangePassword loop.
        window.RM_AUTH_MANUAL_BOOTSTRAP = true;

        $(document).ready(function () {

            // Shared with the submit handler below, so the pre-submit check applies the
            // same "must not contain your name" rule the live list shows.
            var accountIdentifiers = [];

            // The rules and the live ticking both come from the shared module, which
            // reads them from the server. Identifiers are taken from the signed-in
            // account so "must not contain your name" is checked as they type — that
            // is the rule that otherwise only shows up as a rejection.
            RmAuth.refresh().then(function (ok) {
                if (!ok) { window.location.href = '/templates/Volunteers/Login.html'; return; }

                var account = RmAuth.getUser() || {};

                accountIdentifiers = String(RmAuth.pick(account, 'fullName') || '')
                    .split(/\s+/).filter(Boolean);

                var username = RmAuth.pick(account, 'username');
                if (username) accountIdentifiers.push(username);

                PasswordPolicy.attach(
                    document.getElementById('newPassword'),
                    document.getElementById('passwordRulesList'),
                    accountIdentifiers);
            });

            $('#changePasswordForm').on('submit', function (e) {
                e.preventDefault();

                var current = $('#currentPassword').val();
                var next = $('#newPassword').val();
                var confirm = $('#confirmPassword').val();

                if (next !== confirm) { showToast('New passwords do not match', 'warning'); return; }

                // Only the rules the browser can judge. The server is still the
                // authority — this just avoids a pointless round trip, and names the
                // rule that failed rather than saying "does not meet all requirements".
                var unmet = PasswordPolicy.unmetRules(next, accountIdentifiers);
                if (unmet.length) { showToast(unmet[0], 'warning'); return; }

                $('#submitBtn').prop('disabled', true);

                RmAuth.changePassword(current, next, confirm).then(function (result) {
                    $('#submitBtn').prop('disabled', false);

                    if (!result.success) { showToast(result.message || 'Unable to change password', 'error'); return; }

                    // Changing the password revokes every session, including this one.
                    showToast('Password updated. Please sign in again.', 'success');
                    setTimeout(function () { window.location.href = '/templates/Volunteers/Login.html'; }, 1200);
                });
            });
        });
    </script>

</body>
</html>
