<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{TITLE}} — RM CMS</title>

    <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">

    <!--
        Deliberately self-contained: no stylesheet, no script, no font.

        This page is what people see when something is already broken, and every
        external file it depended on would be one more thing that can be the reason
        it does not render. A 500 caused by a failing deployment must not produce a
        blank screen because the CSS it wanted was part of the same deployment.
    -->
    <style>
        :root {
            --ink: #111827;
            --ink-soft: #4b5563;
            --ink-muted: #6b7280;
            --line: #e5e7eb;
            --accent: #1d4ed8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f4f6;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            max-width: 520px;
            width: 100%;
            padding: 34px 32px;
        }

        .brand {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin: 0 0 18px;
        }

        .code {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1;
            margin: 0 0 6px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 10px;
        }

        p {
            margin: 0 0 14px;
            color: var(--ink-soft);
            font-size: 0.94rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            display: inline-block;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 0.9rem;
            font-family: inherit;
            text-decoration: none;
            color: var(--ink);
            background: #fff;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /*
            The correlation id is the whole reason this page is worth having. It is
            what somebody quotes to the office, and what turns "it broke" into a
            single findable line in the log.
        */
        .ref {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 0.8rem;
            color: var(--ink-muted);
        }

        .ref code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.82rem;
            background: #f3f4f6;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--ink);
            user-select: all;
        }

        .ref[hidden] { display: none; }
    </style>
</head>
<body>

    <main class="card">
        <p class="brand">RM CMS</p>

        <div class="code">{{STATUS}}</div>
        <h1>{{TITLE}}</h1>

        <p>{{MESSAGE}}</p>

        <div class="actions">
            <a class="btn btn-primary" href="/">Go to sign in</a>
            <button type="button" class="btn" onclick="history.back()">Go back</button>
        </div>

        <!--
            Hidden by the server when there is no id to show, rather than printed
            empty. A label with nothing after it reads as a second fault.
        -->
        <div class="ref" {{REF_HIDDEN}}>
            If you report this, quote reference <code>{{CORRELATION_ID}}</code>.
        </div>
    </main>

</body>
</html>
