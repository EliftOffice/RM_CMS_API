<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Settings — RM_CMS Admin</title>

    <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
    <link rel="stylesheet" href="/assets/css/admin.css">

    <script src="/assets/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="/assets/js/api-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/admin-shell.js"></script>

    <style>
        .setting-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 150px;
            gap: 10px 16px;
            align-items: start;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }

        .setting-row:last-child { border-bottom: none; }

        @media (max-width: 620px) {
            .setting-row { grid-template-columns: minmax(0, 1fr); }
        }

        .setting-label { font-weight: 600; font-size: 13.5px; }
        .setting-desc  { color: var(--ink-muted); font-size: 12.5px; margin-top: 2px; }
        .setting-key   { color: var(--ink-muted); font-size: 11.5px; font-family: ui-monospace, Consolas, monospace; }
        .setting-bounds{ color: var(--ink-muted); font-size: 11.5px; margin-top: 4px; }

        .setting-input.changed { border-color: var(--accent); background: #f5f8ff; }
        .setting-input.invalid { border-color: var(--danger) !important; }

        .setting-error { color: var(--danger); font-size: 12px; margin-top: 4px; }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
        }

        .job-card {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px;
        }

        .job-card h3 { margin: 0 0 4px; font-size: 14px; }
        .job-card p  { margin: 0 0 12px; color: var(--ink-muted); font-size: 12.5px; }
        .job-result  { margin-top: 10px; font-size: 12.5px; color: var(--ink-muted); }

        .sticky-actions {
            position: sticky;
            bottom: 0;
            background: var(--surface);
            border-top: 1px solid var(--line);
            padding: 12px 0 0;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
        }

        .sticky-actions .spacer { flex: 1; }
    </style>
</head>

<body>

<div id="adminShell"></div>

<main class="page" id="pageBody" hidden>

    <div class="page-head">
        <div>
            <h1 class="page-title">Settings</h1>
            <p class="page-sub">
                Business rules the system follows. Changes take effect immediately —
                no deployment needed.
            </p>
        </div>
    </div>

    <!-- ------------------------------------------------ scheduled work -->
    <section class="card" style="margin-bottom:20px;">
        <div class="card-head">
            <h2 class="card-title">Scheduled work</h2>
        </div>
        <div class="card-body">
            <p class="page-sub" style="margin-top:0;">
                These normally run on a schedule. Run one by hand when you need it now —
                each is safe to run twice, because it only picks up work still outstanding.
            </p>

            <div class="job-grid" id="jobGrid"></div>
        </div>
    </section>

    <!-- ------------------------------------------------ settings -->
    <section class="card">
        <div class="card-head">
            <h2 class="card-title">Business rules</h2>
        </div>
        <div class="card-body">
            <div id="settingsError" class="notice notice-warn" role="alert" hidden></div>
            <div id="settingsBody"><p class="empty">Loading…</p></div>

            <div class="sticky-actions">
                <button type="button" class="btn btn-primary" id="saveBtn" disabled>Save changes</button>
                <button type="button" class="btn" id="resetBtn" disabled>Discard</button>
                <span class="spacer"></span>
                <span class="hint" id="changeCount"></span>
            </div>
        </div>
    </section>
</main>

<script src="/assets/js/settings.js"></script>

</body>
</html>
